# tagging.yaml — Required-tag governance rules for all extended resource types.
#
# One rule per resource type.  All rules share the same condition, scoring, and
# guided-action metadata; only the resource_type / finding_type /
# recommendation_type / title / summary_template differ.
#
# YAML anchors keep the file DRY.

_base: &tagging_base
  enabled: true
  category: governance
  severity: medium
  impact: low
  effort: low
  confidence: high
  actionability: guided
  why_this_matters: "Required tags drive ownership, cost allocation, and automation coverage across the platform."
  recommended_action: "Add Name and Environment tags in AWS for governance and cost allocation."
  approval_required: false
  execution_eligible: false
  conditions:
    - op: any_tag_missing
      tags: [Name, Environment]
  evidence_fields: []

rules:
  - <<: *tagging_base
    rule_id: cloudfront_distribution_missing_required_tags
    resource_type: cloudfront_distribution
    finding_type: cloudfront_distribution_missing_required_tags
    recommendation_type: cloudfront_add_required_tags
    guided_action_key: cloudfront_add_required_tags
    title: "CloudFront distribution is missing required tags"
    summary_template: "CloudFront distribution {resource_id} is missing required governance tags (Name or Environment)."

  - <<: *tagging_base
    rule_id: acm_certificate_missing_required_tags
