server {
    server_name apptest-api.meezi.io;
    access_log /var/log/meezi/nginx-access.log;
    error_log /var/log/meezi/nginx-error.log warn;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/apptest-api.meezi.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/apptest-api.meezi.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
}

server {
    if ($host = apptest-api.meezi.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    access_log /var/log/meezi/nginx-access.log;
    error_log /var/log/meezi/nginx-error.log warn;
    server_tokens off;

    listen 80;
    listen [::]:80;
    server_name apptest-api.meezi.io;
    return 404; # managed by Certbot
}